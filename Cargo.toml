[package]
name = "gavel"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
description = "Terminal review workstation for adjudicating AI-flagged CERT-C secure coding violations"
license = "MIT"
authors = ["Brandon Arrendondo <brandon.arrendondo@bissell.com>"]
readme = "README.md"
keywords = ["cert-c", "code-review", "sqlite", "cli", "tui"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
    "target/",
    "examples/",
    ".github/",
    "about.hbs",
    "about.toml",
]

[[bin]]
name = "gavel"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.29"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"

[profile.release]
lto = true
codegen-units = 1
strip = true
